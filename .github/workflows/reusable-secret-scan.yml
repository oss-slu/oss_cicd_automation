name: Reusable Secret & Credential Leak Scanning

on:
  workflow_call:
    inputs:
      fetch-depth:
        description: 'Depth of git history to fetch for commit diff scanning (0 = full history).'
        required: false
        type: number
        default: 0
      config-path:
        description: 'Optional path to custom .gitleaks.toml configuration file.'
        required: false
        type: string
        default: ''
      fail-on-leak:
        description: 'Whether the workflow step should fail if a secret leak is detected.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Run Gitleaks Security Audit
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ inputs.config-path }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        with:
          config-path: ${{ inputs.config-path }}
          fail: ${{ inputs.fail-on-leak }}