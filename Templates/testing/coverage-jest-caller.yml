# Caller template for JavaScript/TypeScript code coverage reporting using Jest.
# Copy this into your repository's .github/workflows/ directory.
#
# Prerequisites:
#   - Configure Jest with coverage: jest --coverage
#   - Ensure package.json includes: "coverage": "jest --coverage"
#   - Jest generates lcov.info which will be parsed and posted as a PR comment.

name: Code Coverage (Jest)

on:
  pull_request:
    paths:
      - '**.js'
      - '**.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Run Coverage and Post Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test -- --coverage --coverageReporters=lcov

      - name: Post Coverage Report
        uses: ./.github/workflows/reusable-coverage-report.yml
        with:
          coverage_format: lcov
          coverage_file: lcov.info
          comment_header: "## JavaScript/TypeScript Code Coverage Report"