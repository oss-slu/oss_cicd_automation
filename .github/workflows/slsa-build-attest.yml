name: Reusable - SLSA Level 3 Build, SBOM & Provenance Attestation

on:
  workflow_call:
    inputs:
      image-name:
        description: "Target image name (e.g. ghcr.io/oss-slu/oss_dev_analytics)"
        required: true
        type: string
      context:
        description: "Docker build context directory"
        required: false
        type: string
        default: "."
      file:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      target:
        description: "Build target stage"
        required: false
        type: string
        default: ""
      build-args:
        description: "Build-time arguments passed to Docker build (multiline string)"
        required: false
        type: string
        default: ""
      platforms:
        description: "Target architecture platforms (e.g. linux/amd64)"
        required: false
        type: string
        default: "linux/amd64"
      push:
        description: "Whether to push the image to the registry"
        required: false
        type: boolean
        default: true
      runner:
        description: "GitHub-hosted runner OS (must be isolated ephemeral runner for SLSA L3 compliance)"
        required: false
        type: string
        default: "ubuntu-latest"
      registry:
        description: "Container registry host"
        required: false
        type: string
        default: "ghcr.io"
      tags:
        description: "Additional tags specification for docker/metadata-action (multiline string)"
        required: false
        type: string
        default: ""
      generate-sbom:
        description: "Whether to generate an SPDX Software Bill of Materials (SBOM)"
        required: false
        type: boolean
        default: true
      sbom-format:
        description: "SBOM specification format (e.g. spdx-json, cyclonedx-json)"
        required: false
        type: string
        default: "spdx-json"
      sbom-artifact-name:
        description: "Custom name for the uploaded SBOM artifact"
        required: false
        type: string
        default: ""
      attest-provenance:
        description: "Whether to attest SLSA Build Level 3 provenance"
        required: false
        type: boolean
        default: true
      attest-sbom:
        description: "Whether to cryptographically attest the generated SBOM"
        required: false
        type: boolean
        default: true
    outputs:
      image-digest:
        description: "The immutable sha256 digest of the built container image"
        value: ${{ jobs.build-and-attest.outputs.image-digest }}
      image-ref:
        description: "The fully qualified image reference including sha256 digest"
        value: ${{ jobs.build-and-attest.outputs.image-ref }}
      attestation-url:
        description: "The URL of the generated SLSA provenance attestation"
        value: ${{ jobs.build-and-attest.outputs.attestation-url }}
      sbom-attestation-url:
        description: "The URL of the generated SBOM attestation"
        value: ${{ jobs.build-and-attest.outputs.sbom-attestation-url }}
      sbom-digest:
        description: "SHA256 digest of the generated SBOM"
        value: ${{ jobs.build-and-attest.outputs.sbom-digest }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    name: Build, SBOM & Attest SLSA L3 Artifact
    runs-on: ${{ inputs.runner }}
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
      attestation-url: ${{ steps.attest.outputs.attestation-url }}
      sbom-attestation-url: ${{ steps.attest-sbom.outputs.attestation-url }}
      sbom-digest: ${{ steps.sbom-hash.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ inputs.tags }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target != '' && inputs.target || '' }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (Anchore Syft)
        id: sbom
        if: ${{ inputs.push && inputs.generate-sbom }}
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          image: ${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          format: ${{ inputs.sbom-format }}
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false

      - name: Calculate SBOM Digest
        id: sbom-hash
        if: ${{ inputs.push && inputs.generate-sbom }}
        shell: bash
        run: |
          DIGEST=$(sha256sum "${{ runner.temp }}/sbom.spdx.json" | awk '{print $1}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM Artifact
        if: ${{ inputs.push && inputs.generate-sbom }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ inputs.sbom-artifact-name != '' && inputs.sbom-artifact-name || format('{0}-sbom', steps.meta.outputs.version) }}
          path: ${{ runner.temp }}/sbom.spdx.json
          if-no-files-found: error

      - name: Attest SBOM
        id: attest-sbom
        if: ${{ inputs.push && inputs.generate-sbom && inputs.attest-sbom }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - name: Attest SLSA Build Level 3 Provenance
        id: attest
        if: ${{ inputs.push && inputs.attest-provenance }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
