name: Security Secret Scan

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Call Reusable Secret Scan
    uses: oss-slu/oss_cicd_automation/.github/workflows/reusable-secret-scan.yml@main
    with:
      fetch-depth: 0
      fail-on-leak: true
    secrets: inherit