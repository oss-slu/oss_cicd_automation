# ==============================================================================
# Reusable Caller Workflow: SLSA Level 3 Build, Attestation & Harbor Dual-Push
# ==============================================================================
#
# PURPOSE:
# This workflow builds container images on isolated ephemeral GitHub runners,
# generates an SPDX Software Bill of Materials (SBOM) using Anchore Syft,
# signs cryptographically verifiable SLSA Build Level 3 provenance attestations,
# dual-pushes images to GitHub Packages (GHCR) and the on-prem private Harbor registry
# (registry.oss-slu.online), and polls Harbor's Trivy vulnerability scanner to
# post security findings directly into the GitHub Actions Step Summary.
#
# ------------------------------------------------------------------------------
# REQUIRED REPOSITORY SECRETS:
# ------------------------------------------------------------------------------
# Navigate to: Repository Settings -> Secrets and variables -> Actions -> Repository secrets
# Add the following secrets:
#
# 1. HARBOR_ROBOT_USERNAME:
#    The robot account username created in the on-prem Harbor registry for this project
#    (e.g., "robot$repoexplorer-push" or "robot$myproject-push").
#
# 2. HARBOR_ROBOT_PASSWORD:
#    The robot secret token generated by Harbor when the robot account was created.
#    Note: Harbor robot accounts should have "Push / Pull" permissions on the project.
#
# NOTE: Ensure you include `secrets: inherit` in the job calling this workflow so
# the secrets are passed into the centralized reusable workflow.
#
# ------------------------------------------------------------------------------
# REQUIRED PERMISSIONS:
# ------------------------------------------------------------------------------
# The caller job or workflow MUST declare the following permissions:
#
# permissions:
#   contents: read       # To checkout repository code
#   packages: write       # To push images and OCI attestations to ghcr.io
#   id-token: write       # Required by GitHub OIDC / Sigstore to sign SLSA provenance
#   attestations: write  # Required to publish cryptographic attestations in GitHub
#
# ==============================================================================

name: Build, Attest & Publish (SLSA Level 3)

on:
  push:
    branches:
      - main
      - staging
    paths:
      # Adjust paths to match your project files (optional filter)
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/build-attest.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  # Example 1: Single Container Application
  build-and-publish:
    name: Build & Attest Container
    uses: oss-slu/oss_cicd_automation/.github/workflows/slsa-build-attest.yml@main
    with:
      # Target image repository on GitHub Container Registry (ghcr.io)
      image-name: ghcr.io/oss-slu/<YOUR_REPO_NAME>
      # Target image repository on on-prem private Harbor registry
      harbor-image: registry.oss-slu.online/<YOUR_HARBOR_PROJECT>/<APP_NAME>
      # Docker build context directory
      context: .
      # Path to Dockerfile
      file: ./Dockerfile
      # Name for the uploaded SBOM artifact
      sbom-artifact-name: <YOUR_REPO_NAME>-sbom
      # Push image to registries (default: true)
      push: true
      # Fetch Harbor Trivy vulnerability scan and post to Actions Summary
      report-harbor-scan: true
    secrets: inherit

  # Example 2: Multi-Container Setup (e.g. Frontend + Backend)
  # Uncomment and adapt if your repository builds multiple distinct container images:
  #
  # build-frontend:
  #   name: Frontend SLSA L3 Build & Attestation
  #   uses: oss-slu/oss_cicd_automation/.github/workflows/slsa-build-attest.yml@main
  #   with:
  #     image-name: ghcr.io/oss-slu/<YOUR_REPO_NAME>/frontend
  #     harbor-image: registry.oss-slu.online/<YOUR_HARBOR_PROJECT>/frontend
  #     context: ./frontend
  #     file: ./frontend/Dockerfile
  #     sbom-artifact-name: <YOUR_REPO_NAME>-frontend-sbom
  #     push: true
  #   secrets: inherit
  #
  # build-backend:
  #   name: Backend SLSA L3 Build & Attestation
  #   uses: oss-slu/oss_cicd_automation/.github/workflows/slsa-build-attest.yml@main
  #   with:
  #     image-name: ghcr.io/oss-slu/<YOUR_REPO_NAME>/backend
  #     harbor-image: registry.oss-slu.online/<YOUR_HARBOR_PROJECT>/backend
  #     context: ./backend
  #     file: ./backend/Dockerfile
  #     sbom-artifact-name: <YOUR_REPO_NAME>-backend-sbom
  #     push: true
  #   secrets: inherit
