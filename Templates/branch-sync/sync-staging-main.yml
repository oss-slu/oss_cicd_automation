# ==============================================================================
# Workflow Template: Auto-Sync Main to Staging
# ==============================================================================
#
# PURPOSE:
# In GitOps pipelines, code is normally deployed to the 'staging' environment
# first. However, when commits land directly on 'main' (e.g. direct PR merge,
# hotfix, or maintainer action), 'staging' can fall behind 'main'.
#
# This workflow runs automatically whenever changes are pushed to 'main'.
# It fetches the latest 'main' branch and reconciles it into 'staging':
# - If possible, performs a clean fast-forward.
# - If histories have diverged, performs an automated merge commit.
# - If 'staging' does not exist yet remotely, creates and publishes it from 'main'.
# - If merge conflicts occur, fails with a clear diagnostic notice for manual resolution.
#
# ------------------------------------------------------------------------------
# REQUIRED PERMISSIONS:
# ------------------------------------------------------------------------------
# permissions:
#   contents: write       # To push updates and merge commits to branch 'staging'
#   pull-requests: write  # (Optional) For PR creation if configured
#
# ==============================================================================

name: Sync Main to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-branches:
    name: Reconcile Staging Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reconcile Main into Staging
        run: |
          echo "=== Fetching all remote branches ==="
          git fetch origin main:main

          # Check if staging branch exists remotely
          if git ls-remote --exit-code --heads origin staging > /dev/null 2>&1; then
            echo "Staging branch exists. Checking out staging..."
            git checkout staging
            git pull origin staging

            echo "Attempting to reconcile main into staging..."
            # Try fast-forward first, fall back to merge commit
            if git merge origin/main --ff-only; then
              echo "Successfully fast-forwarded staging to main."
            else
              echo "Fast-forward not possible; performing automated merge commit..."
              git merge origin/main -m "chore(gitops): auto-reconcile main into staging [skip ci]"
              echo "Merge completed cleanly."
            fi

            git push origin staging
            echo "Staging branch updated successfully."
          else
            echo "Staging branch does not exist yet. Creating staging from main..."
            git checkout -b staging main
            git push -u origin staging
            echo "Staging branch initialized and published."
          fi

      - name: Handle Reconciliation Conflicts
        if: failure()
        run: |
          echo "::error::Automated reconciliation failed due to merge conflicts between main and staging."
          echo "Please resolve conflicts manually: git checkout staging && git merge main"
